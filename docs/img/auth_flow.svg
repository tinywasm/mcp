<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" font-family="monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 16px; font-weight: bold; fill: #0f172a; }
    .subtitle { font-size: 11px; fill: #64748b; }
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .box-main { fill: #f8fafc; stroke: #334155; }
    .box-auth { fill: #eff6ff; stroke: #3b82f6; }
    .box-rbac { fill: #f0fdf4; stroke: #16a34a; }
    .box-error { fill: #fef2f2; stroke: #dc2626; }
    .box-impl { fill: #fefce8; stroke: #ca8a04; }
    .label { font-size: 12px; font-weight: bold; }
    .label-blue { fill: #1d4ed8; }
    .label-green { fill: #15803d; }
    .label-red { fill: #dc2626; }
    .code { font-size: 11px; fill: #475569; }
    .note { font-size: 10px; fill: #94a3b8; font-style: italic; }
  </style>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" class="title">Auth + RBAC Flow — tinywasm/mcp</text>
  <text x="360" y="48" text-anchor="middle" class="subtitle">HandleMessage → Authorize → Can → Execute</text>

  <!-- Step 1: HandleMessage receives request -->
  <rect x="200" y="70" width="320" height="50" class="box box-main"/>
  <text x="360" y="92" text-anchor="middle" class="label">HandleMessage(ctx, message)</text>
  <text x="360" y="108" text-anchor="middle" class="code">extract id, method, jsonrpc from raw JSON</text>

  <!-- Arrow down -->
  <line x1="360" y1="120" x2="360" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Auth -->
  <rect x="160" y="155" width="400" height="80" class="box box-auth"/>
  <text x="180" y="177" class="label label-blue">① Authenticate</text>
  <text x="180" y="195" class="code">token := ctx.Value(CtxKeyAuthToken)</text>
  <text x="180" y="211" class="code">userID, err := s.auth.Authorize(token)</text>
  <text x="180" y="227" class="code">ctx.Set(CtxKeyUserID, userID)</text>

  <!-- Error branch from Auth -->
  <line x1="560" y1="195" x2="630" y2="195" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="632" y="178" width="80" height="34" class="box box-error"/>
  <text x="672" y="200" text-anchor="middle" class="label label-red" font-size="11">-32001</text>

  <!-- Arrow down -->
  <line x1="360" y1="235" x2="360" y2="265" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Route to tools/call -->
  <rect x="220" y="270" width="280" height="40" class="box box-main"/>
  <text x="360" y="295" text-anchor="middle" class="code">switch method → tools/call</text>

  <!-- Arrow down -->
  <line x1="360" y1="310" x2="360" y2="340" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: RBAC -->
  <rect x="160" y="345" width="400" height="80" class="box box-rbac"/>
  <text x="180" y="367" class="label label-green">② Authorize (RBAC)</text>
  <text x="180" y="385" class="code">tool := s.tools[params.Name]</text>
  <text x="180" y="401" class="code">s.auth.Can(userID, tool.Resource, tool.Action)</text>
  <text x="180" y="417" class="code">// e.g. Can("user", "catalog", 'r')</text>

  <!-- Error branch from RBAC -->
  <line x1="560" y1="390" x2="630" y2="390" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="632" y="373" width="80" height="34" class="box box-error"/>
  <text x="672" y="395" text-anchor="middle" class="label label-red" font-size="11">forbidden</text>

  <!-- Arrow down -->
  <line x1="360" y1="425" x2="360" y2="455" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Step 5: Execute -->
  <rect x="220" y="460" width="280" height="40" class="box box-main"/>
  <text x="360" y="485" text-anchor="middle" class="label">tool.Execute(ctx, req)</text>

  <!-- Implementations -->
  <rect x="30" y="540" width="310" height="120" class="box box-impl"/>
  <text x="50" y="565" class="label" style="fill:#854d0e">TokenAuthorizer</text>
  <text x="50" y="585" class="code">Authorize: constantTimeEqual(token, apiKey)</text>
  <text x="50" y="601" class="code">  → match: ("user", nil)</text>
  <text x="50" y="617" class="code">  → fail:  ("", error)</text>
  <text x="50" y="637" class="code">Can: always true (flat permissions)</text>
  <text x="50" y="653" class="note">timing-safe comparison prevents side-channel</text>

  <rect x="380" y="540" width="310" height="120" class="box box-impl"/>
  <text x="400" y="565" class="label" style="fill:#854d0e">OpenAuthorizer</text>
  <text x="400" y="585" class="code">Authorize: always ("guest", nil)</text>
  <text x="400" y="617" class="code">Can: always true</text>
  <text x="400" y="637" class="note">development / public servers</text>
</svg>
